variant: flatcar
version: 1.0.0
passwd:
  users:
    - name: core
      # Password für 301202. Erstelle mit `openssl passwd -6`
      password_hash: "$6$quosUPLj89/aJPxV$yHAyuyAXAtN3W4/smsmLPtmtCh9xpDSidJU78qwK39ZpFGvtKxQ54SjDjPAL9kRcDeq8qWLw8dBii37ylDb480"

storage:
  files:
    # 1. Verzeichnis /opt/bin für k3s anlegen
    - path: /etc/tmpfiles.d/opt-bin.conf
      mode: 0644
      contents:
        inline: |
          d /opt/bin 0755 root root -

    # 2. Kubernetes-Manifest (Webserver + Service + Traefik Ingress auf Port 80)
    - path: /var/lib/rancher/k3s/server/manifests/webrtc-web.yaml
      mode: 0644
      contents:
        inline: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: webrtc-web
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: webrtc-web
            template:
              metadata:
                labels:
                  app: webrtc-web
              spec:
                containers:
                  - name: whoami
                    image: ghcr.io/traefik/whoami:latest
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: webrtc-web
          spec:
            selector:
              app: webrtc-web
            ports:
              - port: 80
                targetPort: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: webrtc-web
          spec:
            ingressClassName: traefik
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: webrtc-web
                          port:
                            number: 80

systemd:
  units:
    # 1. Docker deaktivieren (nur k3s containerd wird genutzt)
    - name: docker.service
      mask: true
    - name: docker.socket
      mask: true

    # 2. Erstinstallation von k3s beim ersten Booten
    - name: k3s-install.service
      enabled: true
      contents: |
        [Unit]
        Description=Download k3s binary
        Wants=network-online.target
        After=network-online.target
        ConditionPathExists=!/opt/bin/k3s

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/usr/bin/curl -sfL https://github.com/k3s-io/k3s/releases/latest/download/k3s -o /opt/bin/k3s
        ExecStartPost=/usr/bin/chmod +x /opt/bin/k3s

        [Install]
        WantedBy=multi-user.target

    # 3. k3s-Server-Dienst
    - name: k3s.service
      enabled: true
      contents: |
        [Unit]
        Description=Lightweight Kubernetes
        Documentation=https://k3s.io
        Wants=network-online.target k3s-install.service
        After=network-online.target k3s-install.service

        [Service]
        Type=notify
        EnvironmentFile=-/etc/default/%N
        EnvironmentFile=-/etc/sysconfig/%N
        KillMode=process
        Delegate=yes
        LimitNOFILE=1048576
        LimitNPROC=infinity
        LimitCORE=infinity
        TasksMax=infinity
        TimeoutStartSec=0
        Restart=always
        RestartSec=5s
        ExecStartPre=-/sbin/modprobe br_netfilter
        ExecStartPre=-/sbin/modprobe overlay
        ExecStart=/opt/bin/k3s server

        [Install]
        WantedBy=multi-user.target

    # 4. Wöchentliches Auto-Update für k3s (stable-Kanal)
    - name: update-k3s.service
      contents: |
        [Unit]
        Description=Update k3s binary to latest stable release
        Wants=network-online.target
        After=network-online.target k3s.service

        [Service]
        Type=oneshot
        ExecStart=/bin/bash -c '\
          set -e; \
          LATEST=$(curl -sfL https://update.k3s.io/v1-release/channels/stable -o /dev/null -w "%%{url_effective}" | awk -F/ "{print \$NF}"); \
          CURRENT=$(/opt/bin/k3s --version 2>/dev/null | awk "{print \$3}" || echo ""); \
          if [ -z "$LATEST" ] || [ "$LATEST" = "$CURRENT" ]; then \
            echo "k3s ist aktuell ($CURRENT)."; \
            exit 0; \
          fi; \
          echo "Aktualisiere k3s von $CURRENT auf $LATEST..."; \
          curl -sfL "https://github.com/k3s-io/k3s/releases/download/${LATEST}/k3s" -o /opt/bin/k3s.new; \
          chmod +x /opt/bin/k3s.new; \
          mv /opt/bin/k3s.new /opt/bin/k3s; \
          systemctl restart k3s.service'

    - name: update-k3s.timer
      enabled: true
      contents: |
        [Unit]
        Description=Weekly k3s update check

        [Timer]
        OnCalendar=Sun *-*-* 03:30:00
        RandomizedDelaySec=1800
        Persistent=true

        [Install]
        WantedBy=timers.target

    # 5. Alle 15 Minuten auf neues Container-Image in ghcr.io prüfen
    - name: update-webrtc-web.service
      contents: |
        [Unit]
        Description=Pull latest container image and restart deployment if updated
        Wants=network-online.target
        After=network-online.target k3s.service

        [Service]
        Type=oneshot
        ExecStart=/bin/bash -c '\
          set -e; \
          OLD_ID=$(/opt/bin/k3s crictl images -q ghcr.io/traefik/whoami:latest); \
          /opt/bin/k3s crictl pull ghcr.io/traefik/whoami:latest; \
          NEW_ID=$(/opt/bin/k3s crictl images -q ghcr.io/traefik/whoami:latest); \
          if [ "$OLD_ID" != "$NEW_ID" ]; then \
            /opt/bin/k3s kubectl rollout restart deployment/webrtc-web; \
          fi'

    - name: update-webrtc-web.timer
      enabled: true
      contents: |
        [Unit]
        Description=Check ghcr.io for new image every 15 minutes

        [Timer]
        OnBootSec=5min
        OnUnitActiveSec=15min

        [Install]
        WantedBy=timers.target
