#cloud-config
install:
    device: /dev/sda
    reboot: true
name: Config generated by the installer
stages:
    initramfs:
        - commands:
            - ln -sf /usr/share/zoneinfo/Europe/Berlin /etc/localtime
          if: '[ -e /usr/share/zoneinfo/Europe/Berlin ]'
          name: Set the timezone
        - files:
            - content: |
                KEYMAP=de
              encoding: ""
              group: 0
              owner: 0
              ownerstring: ""
              path: /etc/vconsole.conf
              permissions: 420
          name: Set the keyboard layout
        - files:
            - content: |
                keymap="de"
              encoding: ""
              group: 0
              owner: 0
              ownerstring: ""
              path: /etc/conf.d/keymaps
              permissions: 420
          if: '[ -d /etc/conf.d ]'
          name: Set the keyboard layout for openrc
        - users:
            nico:
                groups:
                    - admin
                name: nico
                passwd: $6$l2XmAxc7YYI9okPQ$tL7yFCMdGcPZN.u2cYvEiSb8pCrVF8ST52CGEQi8yQTQXloOevBIOO73vJYVvr1G/qjJyv47lsIIEJsH7dvpC0
