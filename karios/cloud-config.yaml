#cloud-config
hostname: "hadron-web"

users:
  - name: "kairos"
    passwd: "$6$quosUPLj89/aJPxV$yHAyuyAXAtN3W4/smsmLPtmtCh9xpDSidJU78qwK39ZpFGvtKxQ54SjDjPAL9kRcDeq8qWLw8dBii37ylDb480"
    lock_passwd: false
    groups:
      - admin

stages:
  network:
    - name: "SSH Passwort-Login aktivieren"
      files:
        - path: /etc/ssh/sshd_config.d/99-password-auth.conf
          permissions: 0644
          content: |
            PasswordAuthentication yes
      systemctl:
        restart:
          - sshd
  boot:
    - name: "Go Webserver Systemd-Service einrichten"
      files:
        - path: /etc/systemd/system/webserver.service
          permissions: 0644
          content: |
            [Unit]
            Description=Statischer Go Webserver
            After=network-online.target
            Wants=network-online.target

            [Service]
            ExecStart=/usr/bin/webserver
            Environment="PUBLIC_DIR=/var/www/public"
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
      systemctl:
        enable:
          - webserver
        start:
          - webserver