---
- name: Ubuntu Server Wartung - Kernel, Nvidia-Treiber, Docker & Nvidia CDI Setup
  hosts: all
  become: true
  tasks:

    # -------------------------------------------------------------
    # PHASE 0: Laufenden Docker-Dienst vorab beenden
    # -------------------------------------------------------------
    - name: Prüfen, welche Systemd-Dienste existieren
      ansible.builtin.service_facts:

    - name: Docker-Dienst vor Wartung und Upgrades stoppen (falls vorhanden)
      ansible.builtin.systemd_service:
        name: docker
        state: stopped
      when: "'docker.service' in ansible_facts.services"

    # -------------------------------------------------------------
    # PHASE 1: HWE-Kernel & System auf den neuesten Stand bringen
    # -------------------------------------------------------------
    - name: APT-Cache aktualisieren
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: HWE-Kernel und ubuntu-drivers-common installieren
      ansible.builtin.apt:
        name:
          - "linux-generic-hwe-{{ ansible_distribution_version }}"
          - ubuntu-drivers-common
          - ca-certificates
          - curl
          - gnupg
        state: present
        install_recommends: yes

    - name: Alle Pakete und Kernel aktualisieren (full-upgrade)
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Prüfen, ob nach dem Kernel-Upgrade ein Neustart nötig ist
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_after_kernel

    # ZWISCHEN-REBOOT: Startet den Server direkt in den neuen HWE-Kernel
    - name: Zwischen-Neustart durchführen (in den neuen HWE-Kernel booten)
      ansible.builtin.reboot:
        msg: "Zwischen-Neustart durch Ansible (Boot in neuen HWE-Kernel vor Nvidia-Installation)"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 15
      when: reboot_after_kernel.stat.exists

    # -------------------------------------------------------------
    # PHASE 2: Nvidia-Treiber auf dem laufenden HWE-Kernel installieren
    # Hier könnte ein neuer Treiber für meine Kombi aus Kernel und Hardware empfohlen worden sein und wird dann installiert
    # -------------------------------------------------------------
    - name: Empfohlenen Nvidia-Treiber auf neuem Kernel installieren
      ansible.builtin.command: ubuntu-drivers install
      register: ubuntu_drivers_result
      changed_when: "'Installing' in ubuntu_drivers_result.stdout or 'installed' in ubuntu_drivers_result.stdout"

    - name: Prüfen, ob nach der Treiber-Installation ein Neustart nötig ist
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_after_drivers

    # FINALER REBOOT: Lädt den frisch installierten Nvidia-Treiber sauber
    - name: Finaler Neustart durchführen (Nvidia-Treiber laden)
      ansible.builtin.reboot:
        msg: "Finaler Neustart durch Ansible (Nvidia-Treiber aktivieren)"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 15
      when: reboot_after_drivers.stat.exists

    # -------------------------------------------------------------
    # PHASE 3: Docker CE nach offizieller Dokumentation
    # -------------------------------------------------------------
    - name: Docker Keyring-Verzeichnis anlegen (/etc/apt/keyrings)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Offiziellen Docker GPG-Schlüssel herunterladen
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Docker APT-Repository einrichten
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }}
          stable
        filename: docker
        state: present
        update_cache: yes

    - name: Docker Engine & Plugins installieren (automatisch neueste Version)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    # -------------------------------------------------------------
    # PHASE 4: NVIDIA Container Toolkit & CDI-Dateien aktualisieren
    # -------------------------------------------------------------
    - name: NVIDIA Container Toolkit GPG-Schlüssel herunterladen & de-armoren
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      args:
        executable: /bin/bash
        creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

    - name: NVIDIA Container Toolkit Repository einbinden
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg]
          https://nvidia.github.io/libnvidia-container/stable/deb/amd64/
          /
        filename: nvidia-container-toolkit
        state: present
        update_cache: yes

    - name: NVIDIA Container Toolkit installieren (automatisch neueste Version)
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present

    - name: CDI-Verzeichnis sicherstellen (/etc/cdi)
      ansible.builtin.file:
        path: /etc/cdi
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Aktuelle CDI-Spezifikation für vorhandene Hardware generieren
      ansible.builtin.command:
        cmd: nvidia-ctk cdi generate
      register: cdi_generated_spec
      changed_when: false

    - name: CDI-Spezifikation in /etc/cdi/nvidia.yaml ablegen (idempotente Aktualisierung)
      ansible.builtin.copy:
        dest: /etc/cdi/nvidia.yaml
        content: "{{ cdi_generated_spec.stdout }}\n"
        owner: root
        group: root
        mode: "0644"
      register: cdi_file_status

    # -------------------------------------------------------------
    # PHASE 5: Docker final starten / neu starten
    # -------------------------------------------------------------
    - name: Docker-Dienst starten und aktivieren (liest frische CDI-Spezifikationen ein)
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
        enabled: yes
